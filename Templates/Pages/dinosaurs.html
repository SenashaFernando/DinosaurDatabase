{% extends 'layout.html' %}
{% block content %}
<h1 style= "color : rgb(12,4,56);" >ALL DINOSAURS</h1>

<div class= "dinosaur-grid">
    {% for dinosaur in dinosaurs %}
    <div class= "dinosaur-card">

        <h3>{{ dinosaur[1] }}</h3>

        {% if dinosaur[6] %}
         <img src="{{ url_for('static', filename='images/'~ dinosaur[6]) }}"
            alt= "{{ dinosaur[1] }}" >
        {% else %}
            <div class="no-image">No Image Found</div>

        {%if Era[1] %}
         <div class="hidden-info">
         <p><strong>Era:</strong>{{Era[4]}}</p>
        {% endif %}

        <form method="POST" action="/delete/{{ Dinosaur[0] }}"
               onsubmit="return confirm('Delete this dinosaur?')">
            <button  type="submit" class="delete-btn">Delete</button>
        </form>


    </div>

    {% if session.get('admin') %}
    <form method="POST" action="/delete/{{ Dinosaur[1] }}"
    onsubmit="return confirm('Delete this dinosaur?')">
    <button type="submit" class="delete-btn">Delete</button>
    </form>
    {% endif %}

    </div>
    {% endfor %}
 </div>

 {% endblock %}
